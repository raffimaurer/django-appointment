name: demo-verify

on:
  pull_request:
    branches:
      - demo/ready
      - demo/stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: appointments.demo_settings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install -r demo-requirements.lock

      - name: System check
        run: python manage.py check

      - name: Make migrations
        run: python manage.py makemigrations appointment

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python manage.py test appointment -v 2 2>&1 | tee test-output.txt

      - name: Summarise test result
        if: always()
        shell: bash
        run: |
          {
            echo '### demo-verify test result'
            echo '```'
            grep -E '^(Ran [0-9]+ tests|OK|FAILED)' test-output.txt || echo 'No test summary found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: warn
